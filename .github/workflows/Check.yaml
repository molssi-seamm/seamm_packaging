name: Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: setup uv
        uses: astral-sh/setup-uv@v6

      - name: install this package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: git credentials
        uses: oleksiyrudenko/gha-git-credentials@v2-latest
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'

      - name: resolve, compare, upload, commit, release
        run: |
          set -eo pipefail
          uv --version

          # Resolves the package list with uv, compares with the committed
          # database, and on any change uploads the database + lock to Zenodo
          # (a new version of the record) and fills in the DOI on disk.
          check_for_changes

          if [ -z "$(git status --porcelain)" ]; then
            echo "Working directory clean"
          else
            echo "Changes detected"
            git status --porcelain
            echo "##############################################################"
            head -c 2000 environments/SEAMM_packages.json
            echo "##############################################################"
            wc -l environments/seamm.lock.txt
            git commit -a -F commit_message.txt
            git push
            # Create the release. Versions are CalVer (YYYY.M.D); a second
            # release on the same day gets a .1, .2, ... suffix.
            base=$(date '+%Y.%m.%d' | sed -e 's/\.0/./g')
            version=$base
            n=0
            while gh release view "$version" >/dev/null 2>&1; do
              n=$((n + 1))
              version="$base.$n"
            done
            echo "Creating release $version"
            gh release create -F commit_message.txt "$version"
            # Announce on Slack
            gh workflow run Slack.yaml
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
