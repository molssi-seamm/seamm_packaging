name: Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: git credentials
        uses: oleksiyrudenko/gha-git-credentials@v2-latest
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'

      - name: create environment file
        run: |
          echo `pwd`
          cd 
          echo `pwd`
          ls -l
          create_full_environment_file

          cat test.yml

      # More info on options: https://github.com/conda-incubator/setup-miniconda
      - name: create conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          installation-dir: ~/
          environment-file: ../../../test.yml
          activate-environment: seamm
          auto-update-conda: false
          auto-activate-base: false
          show-channel-urls: true
      
      - name: execute py script
        shell: bash -l {0}
        run: |
          # A login shell does not get GitHub's default -eo pipefail, so a failed
          # upload to Zenodo must not silently fall through to the commit below.
          set -eo pipefail
          ls -l ~/
          echo "#############################"
          echo `pwd`
          echo "#############################"
          ls -l
          echo "#############################"
          conda list
          echo "#############################"

          # Run directly: wrapping it in echo `...` hid both the exit status and
          # the line structure of its output.
          check_for_changes

          if [ -z "$(git status --porcelain)" ]; then
            echo "Working directory clean"
          else
            echo "Changes detected"
            echo "##############################################################"
            git status --porcelain
            echo "##############################################################"
            ls -lR
            echo "##############################################################"
            echo "seamm.yml file:"
            echo ""
            cat environments/seamm.yml
            echo "##############################################################"
            echo ""
            echo "\nseamm_pinned.yml file:"
            echo ""
            cat environments/seamm_pinned.yml
            echo "##############################################################"
            echo ""
            echo "Does commit_message.txt exist?"
            ls -l commit_message.txt
            echo ""
            git commit -a -F commit_message.txt
            git push
            # Create the release. Versions are CalVer (YYYY.M.D); a second
            # release on the same day gets a .1, .2, ... suffix.
            base=$(date '+%Y.%m.%d' | sed -e 's/\.0/./g')
            version=$base
            n=0
            while gh release view "$version" >/dev/null 2>&1; do
              n=$((n + 1))
              version="$base.$n"
            done
            echo "Creating release $version"
            gh release create -F commit_message.txt "$version"
            # Announce on Slack
            gh workflow run Slack.yaml
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

